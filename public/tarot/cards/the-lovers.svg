<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1b4d"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4c8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c7322"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)"/>
  <rect x="15" y="15" width="270" height="470" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="25" y="25" width="250" height="450" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="5,5"/>
  <circle cx="15" cy="15" r="4" fill="url(#gold)"/>
  <circle cx="285" cy="15" r="4" fill="url(#gold)"/>
  <circle cx="15" cy="485" r="4" fill="url(#gold)"/>
  <circle cx="285" cy="485" r="4" fill="url(#gold)"/>
  
  <g transform="translate(150, 250)">
    <!-- The Lovers: Two intertwined figures / hearts / wings -->
    <!-- Heart base -->
    <path d="M 0,20 C -40,-20 -60,-60 -20,-80 C 0,-100 0,-40 0,-40 C 0,-40 0,-100 20,-80 C 60,-60 40,-20 0,20 Z" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <!-- Wings/Angel -->
    <path d="M 0,-40 C -40,-80 -80,-30 -100,0 C -50,10 -30,-10 0,-40" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M 0,-40 C 40,-80 80,-30 100,0 C 50,10 30,-10 0,-40" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <!-- Sun/Divine Light above -->
    <circle cx="0" cy="-100" r="10" fill="url(#gold)"/>
    <path d="M 0,-130 L 0,-115 M 0,-85 L 0,-70 M -30,-100 L -15,-100 M 15,-100 L 30,-100 M -20,-120 L -10,-110 M 10,-90 L 20,-80 M 20,-120 L 10,-110 M -10,-90 L -20,-80" stroke="url(#gold)" stroke-width="2"/>
  </g>
</svg>
