<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1b4d"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4c8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c7322"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)"/>
  <rect x="15" y="15" width="270" height="470" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="25" y="25" width="250" height="450" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="5,5"/>
  <circle cx="15" cy="15" r="4" fill="url(#gold)"/>
  <circle cx="285" cy="15" r="4" fill="url(#gold)"/>
  <circle cx="15" cy="485" r="4" fill="url(#gold)"/>
  <circle cx="285" cy="485" r="4" fill="url(#gold)"/>
  
  <g transform="translate(150, 200)">
    <!-- The Moon: Large crescent enclosing a full moon face, two towers -->
    <!-- Full Moon base -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <!-- Crescent Moon -->
    <path d="M 0,-50 A 50 50 0 1 0 0,50 A 40 40 0 1 1 0,-50 Z" fill="url(#gold)"/>
    <!-- Rays / Drops -->
    <path d="M -40,-60 L -35,-50 M -60,-20 L -50,-15 M -60,20 L -50,15 M -40,60 L -35,50" stroke="#fff" stroke-width="2"/>
    
    <!-- Towers -->
    <rect x="-80" y="80" width="20" height="100" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <rect x="60" y="80" width="20" height="100" fill="none" stroke="url(#gold)" stroke-width="2"/>
    
    <!-- Path leading to water -->
    <path d="M -10,180 C -30,140 30,110 0,80" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="4,4"/>
  </g>
</svg>
