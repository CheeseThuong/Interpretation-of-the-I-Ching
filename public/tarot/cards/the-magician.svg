    <line x1="0" y1="-20" x2="0" y2="80" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-20" r="8" fill="url(#gold)"/>
    <polygon points="-20,20 0,0 20,20 0,40" fill="none" stroke="url(#gold)" stroke-width="3"/>
