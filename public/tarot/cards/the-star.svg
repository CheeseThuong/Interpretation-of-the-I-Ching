<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1b4d"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4c8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c7322"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)"/>
  <rect x="15" y="15" width="270" height="470" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="25" y="25" width="250" height="450" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="5,5"/>
  <circle cx="15" cy="15" r="4" fill="url(#gold)"/>
  <circle cx="285" cy="15" r="4" fill="url(#gold)"/>
  <circle cx="15" cy="485" r="4" fill="url(#gold)"/>
  <circle cx="285" cy="485" r="4" fill="url(#gold)"/>
  
  <g transform="translate(150, 220)">
    <!-- The Star: Giant 8-pointed star and 7 smaller stars -->
    <path d="M 0,-60 L 10,-10 L 60,0 L 10,10 L 0,60 L -10,10 L -60,0 L -10,-10 Z" fill="url(#gold)"/>
    <path d="M 0,-40 L 25,-25 L 40,0 L 25,25 L 0,40 L -25,25 L -40,0 L -25,-25 Z" fill="none" stroke="#fff" stroke-width="2"/>
    
    <!-- 7 smaller 8-pointed stars -->
    <g transform="translate(-70, -80) scale(0.3)"><path d="M 0,-60 L 10,-10 L 60,0 L 10,10 L 0,60 L -10,10 L -60,0 L -10,-10 Z" fill="#fff"/></g>
    <g transform="translate(70, -60) scale(0.3)"><path d="M 0,-60 L 10,-10 L 60,0 L 10,10 L 0,60 L -10,10 L -60,0 L -10,-10 Z" fill="#fff"/></g>
    <g transform="translate(-80, 20) scale(0.4)"><path d="M 0,-60 L 10,-10 L 60,0 L 10,10 L 0,60 L -10,10 L -60,0 L -10,-10 Z" fill="#fff"/></g>
    <g transform="translate(80, 30) scale(0.35)"><path d="M 0,-60 L 10,-10 L 60,0 L 10,10 L 0,60 L -10,10 L -60,0 L -10,-10 Z" fill="#fff"/></g>
    <g transform="translate(-40, -100) scale(0.25)"><path d="M 0,-60 L 10,-10 L 60,0 L 10,10 L 0,60 L -10,10 L -60,0 L -10,-10 Z" fill="#fff"/></g>
    <g transform="translate(40, -110) scale(0.3)"><path d="M 0,-60 L 10,-10 L 60,0 L 10,10 L 0,60 L -10,10 L -60,0 L -10,-10 Z" fill="#fff"/></g>
    <g transform="translate(0, -130) scale(0.4)"><path d="M 0,-60 L 10,-10 L 60,0 L 10,10 L 0,60 L -10,10 L -60,0 L -10,-10 Z" fill="#fff"/></g>
    
    <!-- Land/Water line -->
    <path d="M -125,120 C -50,100 50,140 125,120" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M -125,140 Q 0,160 125,140" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
</svg>
