<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1b4d"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4c8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c7322"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)"/>
  <rect x="15" y="15" width="270" height="470" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="25" y="25" width="250" height="450" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="5,5"/>
  <circle cx="15" cy="15" r="4" fill="url(#gold)"/>
  <circle cx="285" cy="15" r="4" fill="url(#gold)"/>
  <circle cx="15" cy="485" r="4" fill="url(#gold)"/>
  <circle cx="285" cy="485" r="4" fill="url(#gold)"/>
  
  <g transform="translate(150, 180)">
    <!-- The Sun: Giant sun with straight and wavy rays, sunflowers below -->
    <circle cx="0" cy="0" r="40" fill="url(#gold)"/>
    <!-- Sun Face (abstract eyes/mouth) -->
    <path d="M -15,-10 Q -5,-15 5,-10" fill="none" stroke="#2a1b4d" stroke-width="2"/>
    <path d="M 5,-10 Q 15,-15 25,-10" fill="none" stroke="#2a1b4d" stroke-width="2"/>
    <path d="M -10,15 Q 0,25 10,15" fill="none" stroke="#2a1b4d" stroke-width="2"/>
    
    <!-- Sun Rays -->
    <g stroke="url(#gold)" stroke-width="3">
      <!-- Straight Rays -->
      <line x1="0" y1="-50" x2="0" y2="-90"/>
      <line x1="0" y1="50" x2="0" y2="90"/>
      <line x1="-50" y1="0" x2="-90" y2="0"/>
      <line x1="50" y1="0" x2="90" y2="0"/>
      <line x1="-35" y1="-35" x2="-65" y2="-65"/>
      <line x1="35" y1="35" x2="65" y2="65"/>
      <line x1="-35" y1="35" x2="-65" y2="65"/>
      <line x1="35" y1="-35" x2="65" y2="-65"/>
      
      <!-- Wavy Rays (using curved paths) -->
      <path d="M -20,-45 Q -20,-70 -35,-85" fill="none"/>
      <path d="M 20,-45 Q 20,-70 35,-85" fill="none"/>
      <path d="M -20,45 Q -20,70 -35,85" fill="none"/>
      <path d="M 20,45 Q 20,70 35,85" fill="none"/>
      <path d="M -45,-20 Q -70,-20 -85,-35" fill="none"/>
      <path d="M 45,-20 Q 70,-20 85,-35" fill="none"/>
      <path d="M -45,20 Q -70,20 -85,35" fill="none"/>
      <path d="M 45,20 Q 70,20 85,35" fill="none"/>
    </g>
    
    <!-- Brick wall & Sunflowers below -->
    <rect x="-100" y="150" width="200" height="40" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="-50" y1="150" x2="-50" y2="190" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="0" y1="150" x2="0" y2="190" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="50" y1="150" x2="50" y2="190" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="-100" y1="170" x2="100" y2="170" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    
    <!-- Abstract Sunflowers -->
    <circle cx="-60" cy="130" r="10" fill="url(#gold)"/>
    <circle cx="60" cy="130" r="10" fill="url(#gold)"/>
    <circle cx="0" cy="120" r="12" fill="url(#gold)"/>
  </g>
</svg>
