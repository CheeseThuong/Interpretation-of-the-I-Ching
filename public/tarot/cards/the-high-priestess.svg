<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1b4d"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4c8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c7322"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" fill="url(#bg)"/>
  <circle cx="50" cy="100" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="250" cy="80" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="200" cy="400" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="80" cy="350" r="1" fill="#fff" opacity="0.3"/>
  <rect x="15" y="15" width="270" height="470" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="25" y="25" width="250" height="450" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="5,5"/>
  <circle cx="15" cy="15" r="4" fill="url(#gold)"/>
  <circle cx="285" cy="15" r="4" fill="url(#gold)"/>
  <circle cx="15" cy="485" r="4" fill="url(#gold)"/>
  <circle cx="285" cy="485" r="4" fill="url(#gold)"/>
  
  <g transform="translate(150, 250)">
    <!-- The High Priestess: Crescent moon, scroll, and pillars -->
    <path d="M 0,-40 A 30 30 0 1 0 0,20 A 20 20 0 1 1 0,-40 Z" fill="url(#gold)"/>
    <!-- Pillars -->
    <rect x="-60" y="-80" width="20" height="180" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <rect x="40" y="-80" width="20" height="180" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <!-- Scroll -->
    <rect x="-15" y="40" width="30" height="40" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <line x1="-5" y1="45" x2="5" y2="45" stroke="url(#gold)" stroke-width="2"/>
    <line x1="-10" y1="55" x2="10" y2="55" stroke="url(#gold)" stroke-width="2"/>
    <line x1="-5" y1="65" x2="5" y2="65" stroke="url(#gold)" stroke-width="2"/>
  </g>
</svg>
